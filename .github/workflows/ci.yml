name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Testes
        run: ./gradlew :shared:jvmTest :server:test :desktopApp:test

      - name: Build dos apps Android (testes e homologação)
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleHomologacao

      - name: Relatórios de teste (se algo falhar)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste
          path: '**/build/reports/tests/'
          retention-days: 7

  windows-msi:
    name: Instalador Windows (.msi, homologação)
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # shell: bash, porque o PowerShell quebra -Pcronosync.environment=... no ponto, em dois argumentos.
      - name: Gerar o .msi
        shell: bash
        run: ./gradlew :desktopApp:packageMsi -Pcronosync.environment=homologacao

      - uses: actions/upload-artifact@v7
        with:
          name: CronoSync-Homolog-windows
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 14
