# nginx da VPS → servidor CronoSync de homologação (docker-compose.yml desta pasta, porta 8095).
#
# Instalação (na VPS; o passo a passo completo está no README.md desta pasta):
#   sudo cp homologacao.focussync.com.br.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/homologacao.focussync.com.br.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d homologacao.focussync.com.br
#
# Aqui só está a parte HTTP (porta 80). O certbot acrescenta sozinho a parte HTTPS (443), com o
# certificado, e o redirecionamento de http:// para https://.

# WebSocket: o aparelho pede "Upgrade: websocket" e o nginx precisa repassar esse pedido. O map
# devolve "upgrade" quando há pedido de upgrade e "close" numa requisição HTTP comum.
map $http_upgrade $cronosync_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name homologacao.focussync.com.br;

    # Os aparelhos só mandam requisições pequenas; algo grande aqui é abuso.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8095;

        # WebSocket (as salas sincronizadas).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cronosync_connection_upgrade;

        proxy_set_header Host $host;
        # IP real do aparelho: o nginx ACRESCENTA no fim da lista o IP que ele viu. O servidor lê
        # justamente o último (CRONOSYNC_BEHIND_PROXY), então um X-Forwarded-For inventado pelo
        # aparelho não engana os limites por IP.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Conexão parada por mais que isso é encerrada. O servidor manda um ping a cada 15 s, então
        # uma sala aberta nunca fica parada tanto tempo.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
